[project]
name = "aegis-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "fastembed>=0.4",
  "langgraph>=0.2",
  "redis>=5.0",
]

[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "fakeredis>=2.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["model: needs the real fastembed model (skipped automatically if it cannot be loaded)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "E702"]  # one-off profiling/bench tools
"tests/test_answer_keys.py" = ["E501"]  # long literal answer strings
"app/domains/nutrition.py" = ["E501"]  # regex row pattern
"app/rag/corpus.py" = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.llm", "app.rag", "app.pipeline", "app.eval"]
