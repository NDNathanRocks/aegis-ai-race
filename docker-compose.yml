# Default:   docker compose up --build                       -> backend + frontend, zero config (demo mode)
# Redis:     REDIS_URL=redis://redis:6379/0 docker compose --profile redis up --build
# pgvector:  DATABASE_URL=postgresql://aegis:aegis@pgvector:5432/aegis docker compose --profile pgvector up --build
# Both profiles can be combined. Set GROQ_API_KEY in .env (or the shell) for live LLM output.
name: aegis

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
    depends_on:
      # Wait for the optional backends only when their profile is enabled.
      redis:
        condition: service_healthy
        required: false
      pgvector:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Resolved by the visitor's browser, not by the container network.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgvector:
    profiles: ["pgvector"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
