name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
      REQUIRE_MODEL: "1" # fail instead of silently skipping the real-embedding tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Frontend (lint + tsc + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images + compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file (all profiles)
        run: docker compose --profile redis --profile pgvector config --quiet
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: aegis-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: aegis-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Smoke test the backend container
        run: |
          docker run -d --name be -p 8000:8000 aegis-backend:ci
          for i in $(seq 1 60); do curl -fs localhost:8000/api/health && break; sleep 2; done
          curl -fs localhost:8000/api/config
          curl -fsN -X POST localhost:8000/api/race/engineered -H 'Content-Type: application/json' \
            -d '{"query":"What is the on-call stipend per week?"}' | grep -q '^event: done'
